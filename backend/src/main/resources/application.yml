spring:
  application:
    name: praetor-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/praetor}
    username: ${SPRING_DATASOURCE_USERNAME:praetor}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local-only}
  jpa:
    # Schema owned by db/schema.sql (applied by postgres initdb). Never let
    # Hibernate create/alter tables — validate once entities exist, none for now.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

# Actuator health includes the DB check → /actuator/health = UP proves DB wiring.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Judge sandbox tunables. Bridged from the SANDBOX_*/JUDGE_WORKERS env (docker-compose
# passes them; .env / .env.example define them). Defaults let the app boot standalone.
# NOTE: the ${ENV:default} bridge is required — Spring relaxed binding does NOT map
# SANDBOX_MEM_MB to praetor.judge.mem-mb on its own.
praetor:
  # JWT signing. docker-compose passes JWT_SECRET/JWT_EXPIRY_MIN from .env; before this block
  # existed the secret was hardcoded in JwtService and both env vars were silently ignored.
  #
  # There is deliberately NO usable default for the secret: a committed fallback is how a
  # deployment ends up signing tokens with a key that is public in git history. The empty
  # `:` default exists only so the failure surfaces as Spring Boot's property report (naming
  # the field and what to do) instead of a raw unresolved-placeholder stack trace.
  # Generate one with: openssl rand -hex 32
  jwt:
    secret:     ${JWT_SECRET:}
    expiry-min: ${JWT_EXPIRY_MIN:120}

  rate-limit:
    # cooldown between two ACCEPTED submissions by the same user (0 disables)
    submission-seconds: ${SUBMISSION_RATE_LIMIT_SECONDS:10}
    # how often expired cooldown entries are swept out of memory
    sweep-ms:           ${SUBMISSION_RATE_LIMIT_SWEEP_MS:300000}

  judge:
    image:       ${SANDBOX_IMAGE:praetor-judge:latest}
    cpu-seconds: ${SANDBOX_CPU_SECONDS:2}
    mem-mb:      ${SANDBOX_MEM_MB:256}
    pids-max:    ${SANDBOX_PIDS_MAX:64}
    workers:     ${JUDGE_WORKERS:2}
    # deployment constants (tied to docker-compose named volume), not per-dev env
    work-dir:     /judge
    volume-name:  praetor_work
    oom-inspect:  false
    # one container per submission (docker exec per case) rather than one per case
    reuse-container: ${SANDBOX_REUSE_CONTAINER:true}
