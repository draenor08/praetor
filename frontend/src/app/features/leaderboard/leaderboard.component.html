<h1 class="page-title">Leaderboard</h1>

<p *ngIf="loading" class="muted">Loading…</p>
<p *ngIf="error" class="error-message">{{ error }}</p>

<div *ngIf="!loading && !error">
  <table class="lb-table">
    <thead>
      <tr>
        <th class="col-rank">#</th>
        <th>Handle</th>
        <th class="col-rating">Rating</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of entries" [class.row-me]="e.handle === me">
        <td class="col-rank num">{{ e.rank }}</td>
        <td>
          {{ e.handle }}
          <span *ngIf="e.handle === me" class="you">you</span>
        </td>
        <td class="col-rating num">{{ e.rating }}</td>
      </tr>
      <tr *ngIf="entries.length === 0">
        <td colspan="3" class="muted">No rated users yet — ratings appear once a contest ends.</td>
      </tr>
    </tbody>
  </table>

  <div class="pager" *ngIf="total > 0">
    <button type="button" class="btn-small" [disabled]="!hasPrev" (click)="load(page - 1)">
      ← Previous
    </button>
    <span class="pager-info">{{ firstShown }}–{{ lastShown }} of {{ total }}</span>
    <button type="button" class="btn-small" [disabled]="!hasNext" (click)="load(page + 1)">
      Next →
    </button>
  </div>
</div>
