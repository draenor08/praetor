<h1 class="page-title">Problems</h1>

<div class="filters">
  <div class="filter-row">
    <input type="search" class="search-input" [(ngModel)]="search" (ngModelChange)="reload()"
           placeholder="Search by title or slug" aria-label="Search problems">

    <label class="band-label">
      Difficulty
      <select [(ngModel)]="band" (ngModelChange)="reload()">
        <option *ngFor="let b of bands" [ngValue]="b">{{ b.label }}</option>
      </select>
    </label>

    <button *ngIf="filtering" type="button" class="btn-clear" (click)="clear()">Clear</button>
  </div>

  <!-- Tags are AND: each one added narrows the list further. -->
  <div class="tag-filter" *ngIf="allTags.length">
    <button *ngFor="let tag of allTags" type="button"
            class="tag tag-toggle" [class.selected]="isTagSelected(tag)"
            [attr.aria-pressed]="isTagSelected(tag)" (click)="toggleTag(tag)">
      {{ tag }}
    </button>
  </div>
</div>

<p *ngIf="loading" class="muted">Loading…</p>
<p *ngIf="error" class="error-message">{{ error }}</p>

<table *ngIf="!loading && !error" class="problem-table">
  <thead>
    <tr>
      <th>Title</th>
      <th>Tags</th>
      <th class="col-diff">Difficulty</th>
      <th class="col-mode">Judge</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of problems">
      <td><a [routerLink]="['/problems', p.slug]">{{ p.title }}</a></td>
      <td class="col-tags">
        <span class="tag" *ngFor="let tag of p.tags">{{ tag }}</span>
        <span *ngIf="!p.tags.length" class="muted">—</span>
      </td>
      <td class="col-diff num">{{ p.difficulty }}</td>
      <td class="col-mode"><span class="tag">{{ p.judgeMode }}</span></td>
    </tr>
    <tr *ngIf="problems.length === 0">
      <td colspan="4" class="muted">
        {{ filtering ? 'No problems match these filters.' : 'No problems yet.' }}
      </td>
    </tr>
  </tbody>
</table>
